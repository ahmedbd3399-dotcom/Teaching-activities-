<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>منصة المعلمة الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B3A34;
  --ink-2:#28504A;
  --ink-3:#3A6A5F;
  --paper:#FBF9F4;
  --paper-2:#F3EFE3;
  --gold:#C08A2E;
  --gold-soft:#E7D4A6;
  --text:#22302B;
  --muted:#6E7C74;
  --line:#E4DCC8;
  --prompt-bg:#EFF3EA;
  --prompt-line:#B9CDB1;
  --danger:#A5453A;
  --shadow: 0 6px 24px rgba(27,58,52,.08);
  --radius: 16px;
  --radius-sm: 10px;
  --maxw: 560px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--ink);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
}
#phone{
  max-width: var(--maxw);
  margin: 0 auto;
  min-height: 100vh;
  background: var(--paper);
  position: relative;
  box-shadow: 0 0 60px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
}
::selection{ background: var(--gold-soft); }

/* ---------- Header ---------- */
.hero{
  background: linear-gradient(165deg, var(--ink) 0%, var(--ink-2) 65%, var(--ink-3) 100%);
  color: #F4EFDF;
  padding: 26px 20px 22px;
  position: relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute; inset:0;
  background-image: radial-gradient(circle at 85% -10%, rgba(199,154,69,.28), transparent 55%);
  pointer-events:none;
}
.hero-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:1;}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:38px; height:38px; border-radius:11px;
  background: var(--gold);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink);
  font-family:'Markazi Text', serif; font-weight:700; font-size:20px;
  flex-shrink:0;
}
.brand-text h1{ font-family:'Markazi Text', serif; font-size:22px; margin:0; font-weight:700; letter-spacing:.2px; }
.brand-text p{ margin:1px 0 0; font-size:11.5px; color: var(--gold-soft); }
.icon-btn{
  width:36px; height:36px; border-radius:50%;
  background: rgba(244,239,223,.12);
  border: 1px solid rgba(244,239,223,.18);
  display:flex; align-items:center; justify-content:center;
  color:#F4EFDF; cursor:pointer; flex-shrink:0;
}
.icon-btn:active{ transform: scale(.94); }
.hero-title{
  font-family:'Markazi Text', serif;
  font-size: 27px; line-height:1.35; margin: 18px 2px 4px; font-weight:600; position:relative; z-index:1;
}
.hero-sub{ font-size:13px; color: rgba(244,239,223,.75); margin: 0 2px 16px; position:relative; z-index:1; }

.search-box{
  position:relative; z-index:1;
  display:flex; align-items:center; gap:8px;
  background: rgba(251,249,244,.96);
  border-radius: 999px;
  padding: 11px 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,.18);
}
.search-box input{
  border:none; outline:none; background:transparent; flex:1;
  font-family:'Cairo',sans-serif; font-size:14.5px; color: var(--ink); direction:rtl;
}
.search-box input::placeholder{ color: #9AA39C; }
.search-box svg{ color: var(--ink-3); flex-shrink:0; }

/* small header for inner pages */
.page-head{
  background: var(--ink);
  color:#F4EFDF;
  padding: 16px 16px 14px;
  display:flex; align-items:center; gap:12px;
  position: sticky; top:0; z-index:5;
}
.page-head .back{
  width:34px; height:34px; border-radius:50%;
  background: rgba(244,239,223,.12);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; cursor:pointer; color:#F4EFDF;
}
.page-head .back:active{ transform: scale(.92); }
.page-head-text{ min-width:0; flex:1; }
.page-head-text .eyebrow{ font-size:11px; color: var(--gold-soft); margin:0 0 2px; }
.page-head-text h2{
  font-family:'Markazi Text', serif; font-weight:700; font-size:20px; margin:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---------- Content area ---------- */
#content{ flex:1; padding: 14px 16px 90px; }
.section-label{
  font-size: 12.5px; color: var(--muted); margin: 6px 4px 10px; font-weight:600;
}

/* ---------- List rows (Surah-list style) ---------- */
.row-list{ display:flex; flex-direction:column; border-radius: var(--radius); overflow:hidden; background: #fff; box-shadow: var(--shadow); }
.row{
  display:flex; align-items:center; gap:12px;
  padding: 13px 14px;
  background:#fff;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  text-decoration:none;
  color:inherit;
}
.row:last-child{ border-bottom:none; }
.row:active{ background: var(--paper-2); }
.row-badge{
  width:40px; height:40px; border-radius:12px;
  background: var(--paper-2);
  color: var(--ink-2);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.row-badge.code{
  font-family:'Markazi Text',serif; font-weight:700; font-size:15px;
  background: transparent; border:1.6px solid var(--gold-soft); color: var(--gold);
}
.row-main{ flex:1; min-width:0; }
.row-main h3{ margin:0; font-size:15px; font-weight:700; color: var(--ink); }
.row-main p{ margin:2px 0 0; font-size:12px; color: var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-chev{ color: var(--muted); flex-shrink:0; transform: scaleX(-1); }
.row-count{ font-size:11px; color:var(--gold); background:var(--gold-soft); border-radius:999px; padding:2px 8px; flex-shrink:0; }

/* group header inside a bank */
.group-title{
  display:flex; align-items:center; gap:8px;
  margin: 22px 4px 10px;
  font-family:'Markazi Text', serif; font-weight:700; font-size:17px; color: var(--ink);
}
.group-title .dot{ width:7px;height:7px;border-radius:50%; background:var(--gold); }
.group-title:first-child{ margin-top:6px; }

/* ---------- Home category cards (list) ---------- */
.cat-row{
  display:flex; align-items:center; gap:14px;
  padding:16px 14px;
  background:#fff;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.cat-row:last-child{border-bottom:none;}
.cat-row:active{ background: var(--paper-2); }
.cat-icon{
  width:46px; height:46px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  color: var(--ink);
  flex-shrink:0;
}
.cat-main{ flex:1; min-width:0; }
.cat-main h3{ margin:0 0 2px; font-family:'Markazi Text', serif; font-size:19px; font-weight:700; color: var(--ink); }
.cat-main p{ margin:0; font-size:12px; color:var(--muted); }
.cat-count{ font-size:11px; color: var(--ink-3); }

.link-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding: 14px 16px; background:#fff; border-radius: var(--radius-sm);
  box-shadow: var(--shadow); margin-bottom:10px; cursor:pointer;
}
.link-row:active{ background: var(--paper-2); }
.link-row-left{ display:flex; align-items:center; gap:10px; color: var(--ink); font-weight:600; font-size:14px; }
.link-row svg.chev{ color:var(--muted); transform: scaleX(-1); }

/* ---------- Reading page ---------- */
.reader{ background:#fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 18px 8px; margin-bottom:16px; }
.reader-eyebrow{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.reader-eyebrow .badge{ font-family:'Markazi Text',serif; font-weight:700; color:var(--gold); border:1.6px solid var(--gold-soft); border-radius:8px; padding:1px 9px; font-size:13px; }
.reader h2.title{ font-family:'Markazi Text', serif; font-size:23px; margin: 2px 0 14px; color: var(--ink); font-weight:700; line-height:1.3; }
.reader h4{ font-family:'Cairo',sans-serif; font-size:13.5px; color:var(--ink-3); margin: 18px 0 8px; font-weight:800; border-inline-start:3px solid var(--gold); padding-inline-start:8px; }
.reader h4:first-of-type{ margin-top:4px; }
.reader p{ font-size:14.5px; line-height:1.85; margin: 0 0 10px; color: var(--text); }
.reader p.label{ font-weight:700; color:var(--ink-2); margin-bottom:4px; }
.reader ul{ margin:0 0 12px; padding-inline-start:20px; }
.reader li{ font-size:14.5px; line-height:1.85; margin-bottom:5px; color:var(--text); }
.reader li::marker{ color: var(--gold); }

.prompt-card{
  background: var(--prompt-bg);
  border: 1.4px dashed var(--prompt-line);
  border-radius: var(--radius-sm);
  padding: 14px 14px 12px;
  margin: 6px 0 18px;
}
.prompt-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.prompt-card-head .ph-title{ display:flex; align-items:center; gap:7px; font-weight:800; color: var(--ink-2); font-size:13.5px; }
.copy-btn{
  display:flex; align-items:center; gap:6px;
  background: var(--ink); color:#F4EFDF;
  border:none; border-radius:999px; padding:7px 13px;
  font-family:'Cairo',sans-serif; font-size:12.5px; font-weight:700; cursor:pointer;
}
.copy-btn.copied{ background: #3E7A52; }
.copy-btn:active{ transform: scale(.96); }
.prompt-card h4{ display:none; }
.prompt-card p, .prompt-card li{ color: var(--ink-2); }

.pager{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin: 4px 0 22px; }
.pager button{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:12px; border-radius: var(--radius-sm); border:1.4px solid var(--line);
  background:#fff; color:var(--ink); font-family:'Cairo',sans-serif; font-weight:700; font-size:13px; cursor:pointer;
}
.pager button:disabled{ opacity:.35; }
.pager button:active:not(:disabled){ background: var(--paper-2); }

/* ---------- Search ---------- */
.search-results{ display:flex; flex-direction:column; gap:8px; }
.search-empty{ text-align:center; color:var(--muted); padding: 60px 20px; font-size:14px; }
.search-hit{ background:#fff; border-radius: var(--radius-sm); padding: 12px 14px; box-shadow: var(--shadow); cursor:pointer; }
.search-hit:active{ background:var(--paper-2); }
.search-hit .path{ font-size:11px; color:var(--gold); margin-bottom:3px; font-weight:700; }
.search-hit h4{ margin:0 0 3px; font-size:14.5px; color:var(--ink); font-family:'Markazi Text',serif; font-weight:700; }
.search-hit p{ margin:0; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
mark{ background: var(--gold-soft); color:var(--ink); border-radius:3px; padding:0 1px; }

/* ---------- Guide gallery ---------- */
.guide-shot{ border-radius: var(--radius); overflow:hidden; box-shadow: var(--shadow); margin-bottom:14px; }
.guide-shot img{ width:100%; display:block; }

/* guide table (متى أستخدم كل وحدة) */
.guide-table{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius: var(--radius-sm); overflow:hidden; margin-bottom:14px; }
.gt-row{ display:flex; gap:0; border-bottom:1px solid var(--line); }
.gt-row:last-child{ border-bottom:none; }
.gt-cell{ padding:10px 12px; font-size:13px; line-height:1.6; }
.gt-goal{ flex:0 0 34%; font-weight:800; color:var(--ink-2); background:var(--paper-2); }
.gt-unit{ flex:0 0 26%; font-weight:700; color:var(--gold); border-inline-start:1px solid var(--line); border-inline-end:1px solid var(--line); }
.gt-desc{ flex:1; color: var(--text); }
.gt-sub{ color:var(--muted); font-size:11.5px; }
.kpi-table .gt-goal{ flex:0 0 40%; }
.kpi-table .gt-desc{ flex:1; border-inline-start:1px solid var(--line); }
.guide-step{ display:flex; align-items:center; gap:8px; margin: 0 2px 8px; }
.guide-step .n{ width:24px;height:24px;border-radius:50%; background:var(--gold); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; font-family:'Cairo'; flex-shrink:0; }
.guide-step span{ font-size:13px; color:var(--ink-2); font-weight:700; }

/* ---------- About ---------- */
.about-hero{ text-align:center; padding: 10px 10px 22px; }
.about-hero .mark{ width:64px;height:64px;border-radius:20px;background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-family:'Markazi Text',serif; font-weight:700; font-size:30px; }
.about-hero h2{ font-family:'Markazi Text',serif; font-size:22px; margin:0 0 4px; color:var(--ink); }
.about-hero p{ font-size:12.5px; color:var(--muted); margin:0; }

/* toast */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background: var(--ink); color:#F4EFDF; padding:10px 20px; border-radius:999px;
  font-family:'Cairo',sans-serif; font-size:13px; font-weight:700;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
  opacity:0; pointer-events:none; transition: all .25s ease; z-index:50;
  display:flex; align-items:center; gap:7px;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.bottom-fade{ height:0; }
::-webkit-scrollbar{ width:0; height:0; }

@media (min-width: 561px){
  body{ padding: 20px 0; }
  #phone{ min-height: calc(100vh - 40px); border-radius: 28px; overflow:hidden; }
}
</style>
</head>

     "title": "نبذة عن جمعية من أحياها",
     "intro": "<p>من أحياها هي جمعية مصرية غير حكومية وغير هادفة للربح تأسست عام ٢٠٠٧. تعمل من أحياها على إتاحة التعليم للأطفال في المناطق المهمشة في مصر. تؤمن من أحياها بالتعليم كمدخل أساسي لتنمية المجتمعات.</p>\n<p>هدف جمعية من أحياها الرئيسي هو إتاحة تعليم للاطفال بجودة عالية يجمع بين أحدث الفلسفات التعليمية والثقافة والتراث المحلي ليبني شخصية الطفل واحساسه بهويته المتفردة إضافة إلى بناء حسه المجتمعي واهتمامه بمساعدة الأخرين. تتخذ من أحياها الثقافة المحلية كأساس لبناء فلسفتها التعليمية ليتمكن الطفل من تطويع موارد مجتمعه المحلي ليستطيع مواجهة التحديات المختلفة. تعمل مدارس من أحياها أيضا كمراكز مجتمعية حيث تقدم خدمات تعليمية وتنموية مختلفة للمجتمع.</p>\n<ul><li>رؤية ورسالة جمعية من أحياها</li></ul>\n<p class='label'>الرؤية:</p>\n<ul><li>\"دعم نمو وتطور مجتمعات منظمة قادرة على التعلم المستمر والاستدامة\"</li></ul>\n<p class='label'>الرسالة:</p>\n<ul><li>بناء مساحات للتعلم ومراكز مجتمعية تسمح بالتبادل والتواصل وخلق فرص جديدة للمجتمع.</li><li>نظرية التغيير يقصد بها:-</li></ul>\n<p>هـي أداة تخطيط ٍّ استراتيجي للمنظمـات المجتمعيـة، تسـاعد علـى رسـم ٍ التغييــر الذي يربط بيــن الأثــر بعيــد المــدى والتدخلات التــي تقــوم بهــا المنظمــة.</p>\n<p class='label'>و تتكون نظرية التغيير من خمسة عناصر رئيسية:</p>\n<ul><li>- النتيجة بعيدة المدى التي بإمكان المنظمة تحقيقها.</li><li>- النتائـج متوسطـة وقريبـة المـدى الـلازم حصولهـا للوصـول للنتيجـة > بعيـدة المـدى</li><li>المتطلبات:-</li><li>- مؤشرات النتائج.</li><li>- التدخلات التي ستقوم بها المنظمة لتحقيق النتائج. ْ</li><li>- الفرضيات التى بنت عليها المنظمة نظرية التغيير.</li></ul>\n<p class='label'>ما هي نظرية التغيير؟</p>\n<p>هى أداة عملية موجهة بشكل أساسي للمنظمات المجتمعية، الراغبة فــي إحــداث تغييــربشــكلٍ محــدد فــي المجتمعات المستهدفة؛ هــذه الأداة تربــط بيــن تدخلات المنظمــة و الأثــر المرجو إحداثه، مــرور بمتطلبات إحداث الأثر وقياس كل ذلك عبر مؤشرات محددة وبناء على افتراضات منطقية ومدعمة الأدلــة.</p>\n<p class='label'>تقدم من أحياها ثلاثة تدخلات مجتمعية أساسية:</p>\n<ul><li>1. مدارس مجتمعية</li><li>2. تطوير المعلمات</li><li>3. أكاديمية للكبار</li><li>4. توأمة المدارس</li></ul>\n<p>تخدم من أحياها حتى الأن مجتمعين في منطقة العياط بالجيزة من خلال مدرستين مجتمعتين . الأولى تم انشأها في ٢٠١٦ في قرية البحاروة والثانية في ٢٠١٧ في قرية بهبيت.</p>\n<ul><li>١- المدارس المجتمعية</li></ul>\n<p>بحسب تقرير صادر عن المركز القومي للتعبئة والإحصاء في ٢٠١٨ ، مصر بها 1,122,000 طفل متسرب من التعليم منهم 322,000 في المرحلة الابتدائية.</p>\n<p class='label'>توجد عدة أسباب لهذه الظاهرة منها على سبيل المثال :</p>\n<ul><li>- الفقر مما يؤدي إلى ترك الأطفال لمدارسهم والعمل لكسب > العيش.</li></ul>\n<p>- قلة المدارس القريبة من أماكن سكن الأطفال مما يؤدي إلى قطعهم مسافات > طويلة سيرا تصل أحيانا إلى ٧ كيلومترات. يجعل ذلك الوضع أكثر سوءا > للفتيات مما يؤدي لتركهم التعليم.</p>\n<ul><li>- ندرة وسائل المواصلات الآمنة مما يؤدي لزيادة المشكلة.</li><li>- كثافة الفصول في المدارس الحكومية مما يؤدي لقلة جودة > التعليم.</li></ul>\n<p>للتغلب على هذه التحديات تقدم من أحياها نموذجا لإتاحة تعليم ذو جودة للأطفال داخل قراهم وبالقرب من منازلهم. لذلك شعارنا هو \"مدرسة في كل قرية\".</p>\n<p>مدارسنا المجتمعة هي مدارس ابتدائية تحت إشراف وزارة التربية والتعليم و تخدم الأطفال بين ٦ إلى ١٤ عاما للالتحاق بالصف الأول الابتدائى وتمنحهم الشهادة الابتدائية الحكومية الرسمية. يستطيع الطلاب بعد ذلك استكمال تعليمهم في أي مدرسة إعدادية بصورة طبيعية.</p>\n<p>[نخدم المجتمعات المحلية عن طريقة منهجيات عالمية ولكن بعد وضعها في سياق الثقافة والطبيعة المحلية. ]{.mark}</p>\n<p class='label'>نهدف من خلال مدارسنا المجتمعية إلى:</p>\n<p>- خلق مساحة تعليمية آمنة وداعمة تتيح للأطفال بيئة تعليمية وفرصة > لتنمية وتطوير مهاراتهم الحياتية. وذلك من خلال تطوير:</p>\n<ul><li>1. الجانب الثقافي.</li><li>2. الجانب الأخلاقي والقيمي.</li><li>3. الجانب التشاركي مع المجتمع (قيم وممارسات المشاركة > المجتمعية).</li><li>4. الجانب الأدائي (المهارات التي يحتاجها للمشاركة > المجتمعية).</li><li>5. التنمية البدنية والنفسية والصحية.</li><li>6. التعليم الأكاديمي.</li><li>7. توفير بيئة تعليمية يستطيع الطفل من خلالها تطوير واكتشاف نفسه > والعالم وتحفيز فضوله.</li><li>8. توفير بيئة داعمة يكون الطفل فيها هو مركز العملية التعليمية > والمعلمات ميسرات لها.</li></ul>\n<p>9. توفير تدريبات مستمرة للمعلمات حتى يتمكن من تطوير مهاراتهم التعليمية > من خلال التعليم والقراءة الدائمة.</p>\n<ul><li>10. توفير عناية خاصة لرفاهة الأطفال وصحتهم.</li><li>11. إشراك أولياء الأمور في تعليم أطفالهم والبقاء على التواصل الدائم > معهم.</li></ul>\n<p>12. إشراك المجتمع في عمل المدرسة وآلية اتخاذ القرار بها وتشجيع الأطفال > على المشاركة في مجتمعهم.</p>\n<p class='label'>فلسفة من أحياها التعليمية:</p>\n<ul><li>- تعليم بمنظور عالمي</li></ul>\n<p>فلسفة من أحياها التعليمية هي نتاج دمج عدد من الفلسفات و المنهجيات > التعليمية العالمية وتتضمن التعليم القائم على المجتمع والتعليم > التكاملي والتربية من أجل التنمية المستدامة والتعلم الشمولي . بدمج هذه > الفلسفات والمنهجيات مع الواقع المصري والمجتمعي أصبحت فلسفة من أحياها > مناسبة للتعليم في القرى والمجتمعات المصرية.</p>\n<ul><li>- دمج الثقافة والتراث المحلي</li></ul>\n<p>تؤمن من أحياها أن التعليم يحدث أثناء التفاعل مع المجتمع حيث لا يمكن > تنشئة طفل بمعزل عن مجتمعه وثقافته وتراثه. لذلك كل مساحة تعليمية من > مساحات من أحياها تختلف باختلاف المجتمع الذي تستهدفه. يعمل خبرائنا > التربويون على تطوير عملية تعليمية تأخذ بعين الاعتبار الثقافة المحلية > والموارد والتحديات الخاصة بالمجتمع لتنمية حس الانتماء والهوية لدى > الأطفال.</p>\n<ul><li>- تنمية الهوية المجتمعية المستقلة</li></ul>\n<p>بالإضافة للاهتمام بهوية الطفلة المتفردة. تحتفي فلسفة من أحياها > باختلاف كل طفل وتساعده على اكتشاف مواهبه ومهاراته وما يجعله مختلفا مع > الاحتفاظ بربطه بالمجتمع والثقافة والعالم الكبير حيث أننا جميعا جزء من > عالم أكبر وأوسع.</p>\n<p class='label'>موضوعات التعليم الأساسية:</p>\n<p>إضافة إلى التعليم التقليدي والرسمي تقدم مدارس من أحياها عددا من الأنشطة والبرامج التي صممها خبرائنا التربويون لإثراء التجربة التعليمية لدى الأطفال وتحقيق أهدافنا التعليمية، ومنها:</p>\n<p>- التربية البدنية: التربية البدنية تعمل على الحفاظ على صحة > الأطفال. حيث يمارسون الرياضة بحسب قدراتهم الجسمانية > وأعمارهم.</p>\n<p>- الفنون: من خلال هذا البرنامج يتعلم الأطفال التعبير عن أنفسهم من > خلال الفنون. يدخلون في رحلة لاستكشاف وتعلم العديد من المهارات > الفنية بحسب ما يفضلون وما يهتمون به.</p>\n<p>نقدم أيضا الدراما والتي من خلالها يستطيع الطفل تعلم وفهم مشاعره > ومشاعر المحيطين به. يتحقق ذلك من خلال التمثيل ولعب الأدوار المختلفة > وتعلم كيفية استخدام الأصوات والجسد للتعبير عن شخصيات ومشاعر وأفكار > مختلفة. كما يتعلمون أيضا عن الموسيقى والأدب.</p>\n<p>- المكتبة: المكتبة هي مساحة ذات أهمية كبيرة في مدارس من أحياها. > تهدف المكتبة إلى تشجيع الأطفال على القراءة واكتشاف مواهبهم > الأدبية. إضافة إلى ذلك يتعلمون بها عن ثقافتهم وتاريخهم ويبحثون عن > إجابات لتساؤلات عن العالم.</p>\n<p>- الصحة والدعم النفسي والمجتمعي: يهدف هذا البرنامج إلى دعم الصحة > البدنية والنفسية للأطفال من خلال ثلاثة أنشطة > أساسية</p>\n<p>- التوعية الصحية: التي تدور حول مساعدة الأطفال على استبدال عاداتهم > غير الصحية بعادات صحية إضافة إلى التعلم عن صحتهم.</p>\n<ul><li>- خدمات صحية: والتي تتضمن وجود طبيب في المدرسة لمتابعة صحة > الأطفال.</li></ul>\n<p>- الدعم النفسي والاجتماعي: تقديم وسائل متعددة لدعم الأطفال نفسيا > والتأكيد على سلامتهم النفسية. إضافة إلى وجود وسائل لتقديم الدعم > الخاص للحالات التي تعاني من اضطرابات حادة ومتوسطة.</p>\n<p>- وجبات مدرسية صحية: يعاني الأطفال في المجتمعات المهمشة من سوء > التغذية والأنيميا وقد أكد الأطباء الذين قاموا بزيارة المدرسة على > وجود عدة درجات من الأنيميا بين الأطفال لتناولهم وجبات غير صحية. > لذلك نعمل على توفير وجبة يومية صحية لكل طفل في مدارسنا. ونتأكد من > تفريقهم بين الأكل الصحي وما يسبب لهم ضررا. ></p>\n<ul><li>```{=html} <!-- --> ``` - دمج التكنولوجيا في مدارس من أحياها المجتمعية:</li></ul>\n<p>تتبنى مدارس من أحياها منهجية دمج التكنولوجيا في التعليم والتي تهدف > إلى تقديم التكنولوجيا للأطفال مبكرا واستخدامها لتحسين العملية > التعليمية. يحدث ذلك من خلال إضافة جهاز كمبيوتر في كل فصل وتصميم مشاريع > يستطيع من خلالها الأطفال استخدام التكنولوجيا والبحث. كما تم مد الأطفال > في الصف الرابع الابتدائي بأجهزة التابلت التعليمية. دعم ذلك استكمال > برامجنا التعليمية والتأكد من أن تعليم أطفالنا لم يتضرر كثيرا في خلال > فترة الجائحة .</p>\n<p class='label'>٢- تطوير المعلمات:</p>\n<p>المعلمات هن أساس أي عملية تعليمية ولذلك هم من أهم الفئات المستهدفة عن > طريق برامج من أحياها. نقوم بتعيين معلماتنا من المجتمعات التي نعمل بها > حصرا ويدخلون في رحلة تعليمية طويلة لإمدادهم بما يحتاجون من معرفة > ومهارات لتحقيق تجربة تعليمية ذات جودة عالية لطلابنا.</p>\n<p>يتم العمل مع المعلمات بصورة متكاملة تستهدف جوانب إنسانية متعددة وليس > فقط كونهن معلمات حيث يتم اعطائهم وسائل تساعدهن على التعامل مع الجوانب > الشخصية المختلفة ليتمكن من الحضور بصورة كاملة في الفصول. كما يتدربن > على فلسفتنا ومناهجنا ليصبحن متعلمات مدى الحياة. إضافة إلى ذلك برامجنا > التعليمية مفتوحة للمعلمات من المجتمع ممن لا يعملن في مدارسنا وذلك لنشر > رسالتنا وما نطمح لتحقيقه في العملية التعليمية.</p>\n<p>صممت من أحياها تدريباتها خصيصا للمعلمات للتركيز على تطويرهن على > المستوى الشخصي والنفسي والتقني. > > عملنا مع المعلمات يتحقق من خلال اربعة جوانب:</p>\n<p>١- التعلم من منظور جديد: > > يطور من معرفة وفهم المعلومات لكيفية حدوث عملية التعلم وكيف يراكم > الأطفال المعرفة. كما يساعدهم على فهم كيفية نمو وتطور الأطفال أكثر > وعلى التعرف على أنواع الذكاءات المختلفة والتعرف على وسائل تعليم مختلفة > إضافة إلى كيفية تهيئة بيئة تعليمية يكون مركزها هو المتعلم.</p>\n<p>كما يعمل على تطوير المهارات الأساسية مثل تطوير مواد تعليمية مختلفة > واستخدام خامات من البيئة المحيطة وإدارة مساحة تعليمية ومهارات التيسير > وإدارة الفصل والتصميم. ومهارات أخرى تتضمن المبادرة وحل المشكلات وإدارة > الوقت.</p>\n<p>إضافة إلى ذلك نعمل على تطوير سلوك المعلمة من خلال تطوير مهارات مثل > المرونة والبحث عن معلومات جديدة وتفهم أن الأخطاء جزء من العملية > التعليمية والتمكن من تخطي العقبات.</p>\n<p>٢- التعلم النفسي > والاجتماعي: > > إدارة الذات وفهم النفس والمجتمع والمهارات الاجتماعية واتخاذ > القرار.</p>\n<p>٣- أساسيات النظرية والتطبيق لكل > مادة: > > فهم الإطار النظري للمادة والتدريب على تدريسها إضافة إلى تصميم أنشطة > خاصة بكل مادة وربطها باستراتيجيات من أحياها.</p>\n<p>٤ -أساسيات الصحة للأطفال: > > للفهم أكثر عن صحة الأطفال وممارسة الاسعافات الاولية في وقت الأزمات > والتمكن من التعرف والإبلاغ عن المشاكل الصحية التي تؤثر على تعلم وتطور > الأطفال. إضافة إلى التمكن من تصميم وتطوير أنشطة وتدخلات تساعد على > تكوين عادات صحية لدى الأطفال.</p>\n<p>- تتحقق هذه الأهداف من خلال عدة مساقات تدريبية تغطي عدد كبير من > الموضوعات، بعض هذه المساقات تقدم قبل أن تبدأ المعلمة العمل مع > الأطفال والبعض الأخر في خلال سنوات العملية التعليمية. المساقات > مصممة لتجمع عدد من الموضوعات والمهارات التي تتصل ببعضها. كل مساق > يتبنى منهجيات محددة حتى تستطيع المعلمات اختبار استراتيجيات وطرق > متعددة للتعلم ويتمكن من التوصل للوسائل والاستنتاجات المناسبة لهن > من كل استراتيجية.</p>\n<p class='label'>الموضوعات الأساسية:</p>\n<p class='label'>1. كيف يتم التعلم؟</p>\n<ul><li>2. فلسفات ونماذج تربوية متنوعة.</li><li>3. فلسفة ومنهجية من أحياها التربوية.</li><li>4. مهارات التيسير.</li><li>5. مهارات التصميم.</li><li>6. استراتيجيات التدريس.</li><li>7. التعلم العاطفي والاجتماعي.</li><li>8. التربية الإيجابية.</li><li>9. التقويم التكويني.</li><li>10. المسرح والدراما كوسيلة تعلم.</li><li>11. مهارات الحكي.</li><li>12. الجودة في المؤسسات التربوية.</li><li>13. التخطيط والتحضير لكل مادة.</li><li>14. تحضير وتوثيق الدروس.</li><li>٣- أكاديمية تعليم الكبار</li></ul>\n<p>[تؤمن من أحياها بدعم المجتمع ككل وبالتعليم كمدخل أساسي للتنمية لذلك تعمل أكاديمية تعليم الكبار على ثلاثة فئات وهي أولياء الأمور والشباب فوق ١٤ سنة والقادة المجتمعيين. تدخل من أحياها الحالي هو فصول محو أمية للكبار يستهدف هذه الفئات.]{.mark}</p>\n<p>يستهدف البرنامج الفئة العمرية بين ١٦ و٦٠ عاما من ثلاثة قرى في العياط وهي بهبيت والبحاروة ومتانيا وهم ممن لم يتاح لهم فرصة التعلم من قبل.</p>\n<p>يرتكز البرنامج على منهجية Reflect والتي تستخدم عالميا لتعليم الكبار. تعتمد هذه المنهجية على تقنيات متعددة تساعد المتعلمين على التعبير عن أنفسهم دون الاعتماد على القراءة والكتابة وتستخدم مثلا الرسم البياني والطبيعة بالإضافة إلى القصص والأغاني لتحليل ومناقشة الموضوعات الاجتماعية والثقافية. وذلك لأن التطور في الكتابة والقراءة ومهارات التواصل الأخرى متصل إلى حد كبير بمشاركة المتعلمين في الأنشطة الاجتماعية والتنموية المختلفة.</p>\n<p class='label'>أهداف البرنامج الأساسية:</p>\n<p>- تدريب الشباب المتعلم على منهجية Reflect > لتنشئة شباب قادر على إيجاد حلول وتدخلات اجتماعية > مختلفة</p>\n<ul><li>- إنهاء الأمية في الثلاثة قرى المستهدفة.</li></ul>\n<p>- خلق بيئة تواصل وتعليم آمنة يستطيع المتعلمون فيها مشاركة آرائهم عن > المجتمع وإعادة تقييم عاداته غير الصحية.</p>\n<p class='label'>مدارسنا:</p>\n<ul><li>١- البحاروة، العياط ، تقع على بعد ٦٥ كيلومترا من محافظة الجيزة:</li></ul>\n<p>- المجتمع: تتكون البحاروة من ١٥٠ وحدة سكنية ومتوسط عدد الأطفال بين ٣ > إلى ١٦ عاما هو ٣٠٠ طفل</p>\n<ul><li>- مساحة المدرسة: 500 متر مربع</li><li>٢- بهبيت ، العياط ، تقع على بعد ٦٥ كيلومترا من محافظة الجيزة:</li><li>- المجتمع: أكثر من ٥٠٠٠ شخص</li><li>- مساحة المدرسة: 1000 متر مربع</li></ul>\n<p class='label'>٣- عزبة حبلوك، محافظة الفيوم:</p>\n<p>تقع على بعد ٣٦ كم من مدينة الفيوم ولكن الوصول لها يتطلب ساعة ونصف نتيجة لعدم وجود شبكة طرق آمنة ممهدة تؤدي إليها. تقع أيضا على بعد ٢ كم من مدينة ماضي التاريخية و ٨ كم من محمية وادي الريان (ولكن لا يوجد طريق مباشر لها من هناك لذلك المسافة ٦٦ كم بالسيارة).</p>\n<ul><li>- المجتمع: تخدم ٦ عزب محيطة، مجتمع مكون من حوالي ٧٥٢٠ شخص</li><li>- مساحة المدرسة: ٣٦٠٠ متر مربع</li><li>- ستبنى بنظام البناء البيئي</li><li>- الشركاء: مؤسسة بناء</li></ul>\n<p class='label'>شركاء من أحياها:</p>\n<ul><li>- راية</li><li>- دودل فاكتوري</li><li>- جمعية أوتاد الخبرية</li><li>- دروسوس</li><li>- مدرسة الاسكندرية للغات</li><li>- بنك التجاري وفا</li><li>- تي لاين للاستشارات الهندسية</li><li>- نهضة مصر</li><li>- المركز الثقافي البريطاني</li><li>- مافنز</li><li>- السفارة الأسترالية</li><li>- خطوة</li></ul>"

     "intro": "<p>وُلدت فكرة هذه المنصة داخل برنامج \"تكنولوجيا التعليم والإدارة\" لإعداد المعلمين والمعلمات في جمعية من أحياها، كمشروع تطبيقي هدفه توظيف الذكاء الاصطناعي لحل مشكلة حقيقية داخل المدرسة.</p><p>من بين خمسة مسارات مقترحة للمشروع (تربوي، إداري، إعلامي، دعم الأطفال، والتطوير المهني)، اختار الفريق المسار التربوي، وتحديدًا مشكلة ضيق وقت المعلمة في تحضير الأنشطة والوسائل وأدوات التقويم قبل الحصة. وتطوّر الحل من مجرد مجموعة برومبتات إلى منصة متكاملة تضم بنوكًا منظمة للتمهيد والأنشطة والوسائل والتقويم والدعم والإثراء، مع برومبتات جاهزة ودليل استخدام شامل.</p>"

     "title": "التقرير الانعكاسي للمشروع",
     "intro": "<ul><li>منصة المعلمة الذكية (AI Teacher Toolkit)</li><li>أولًا: مقدمة</li></ul>\n<p>جاء هذا المشروع استجابةً لتحدٍ حقيقي واجه فريق العمل داخل مدارس من أحياها، وهو ضيق الوقت الذي تواجهه المعلمة في إعداد الأنشطة التعليمية والوسائل وأدوات التقويم قبل الحصة، مما يؤثر في تنوع الممارسات الصفية ويزيد العبء الواقع على المعلمة.</p>\n<p>بعد تحليل المشكلة ومناقشة عدة بدائل، كان الاتجاه الأول للفريق هو تصميم مجموعة من البرومبتات الجاهزة لاستخدامها مع أدوات الذكاء الاصطناعي، إلا أنه خلال جلسات الورشة والنقاش مع المدرب تم تطوير الفكرة لتصبح منتجًا أكثر شمولًا واستدامة، وهو منصة المعلمة الذكية التي تضم بنوكًا منظمة للتمهيد والأنشطة والوسائل والتقويم والدعم والإثراء، بالإضافة إلى برومبتات جاهزة ودليل استخدام.</p>\n<ul><li>ثانيًا: مراحل تنفيذ المشروع</li></ul>\n<p class='label'>مر تنفيذ المشروع بعدة مراحل متتابعة:</p>\n<ul><li>المرحلة الأولى: تحديد المشكلة</li></ul>\n<p>ناقش الفريق عددًا من التحديات التي تواجه المعلمات داخل المدرسة، ثم تم الاتفاق على أن أكثرها تأثيرًا هو ضيق وقت التحضير، لكونه يؤثر في جودة التخطيط للحصة ويحد من تنوع الأنشطة التعليمية-</p>\n<ul><li>المرحلة الثانية: دراسة الاحتياج</li><li>تم تحليل احتياجات المعلمة قبل الحصة، وتبين أنها تحتاج غالبًا إلى:</li><li>- تمهيد مناسب للدرس.</li><li>- نشاط تعليمي متنوع.</li><li>- وسيلة تعليمية.</li><li>- أداة تقويم.</li><li>- أنشطة دعم وإثراء.</li><li>وكان إعداد هذه العناصر بشكل منفصل يستغرق وقتًا وجهدًا كبيرين.--</li><li>المرحلة الثالثة: تطوير الفكرة</li></ul>\n<p>في البداية كان الحل المقترح عبارة عن مجموعة برومبتات فقط، ولكن بعد التغذية الراجعة من المدرب تم تحويل الفكرة إلى منتج عملي يحمل اسم منصة المعلمة الذكية، بحيث تصبح البرومبتات جزءًا من منظومة متكاملة وليس المنتج بأكمله.-</p>\n<ul><li>المرحلة الرابعة: تصميم المنتج</li></ul>\n<p class='label'>تم تقسيم المنصة إلى وحدات رئيسية هي:</p>\n<ul><li>- البرومبتات الأساسية.</li><li>- بنك التمهيد.</li><li>- بنك الأنشطة.</li><li>- بنك التقويم.</li><li>- بنك الوسائل التعليمية.</li><li>- بنك الدعم والإثراء.</li><li>- دليل الاستخدام.</li></ul>\n<p>وقد روعي في تصميم جميع الوحدات توافقها مع فلسفة مدارس من أحياها القائمة على التعلم النشط، والتعلم التعاوني، ومراعاة الفروق الفردية.--</p>\n<ul><li>ثالثًا: تجربة التطبيق الأولية</li><li>تم إجراء تجربة أولية على عدد من البرومبتات داخل المنصة باستخدام أحد الدروس الدراسية.</li></ul>\n<p class='label'>وشملت التجربة:</p>\n<ul><li>- إنتاج تمهيد للدرس.</li><li>- إنشاء نشاط تعليمي.</li><li>- تصميم وسيلة تعليمية.</li><li>- إعداد أداة تقويم.</li><li>- إنشاء نشاط علاجي ونشاط إثرائي.</li></ul>\n<p>وأظهرت التجربة أن المنصة تمكنت من إنتاج مخرجات منظمة خلال وقت قصير، مع إمكانية تعديلها بسهولة لتناسب طبيعة الفصل الدراسي.</p>\n<p>كما تبين أن البرومبتات كانت أكثر دقة عندما تم إدخال بيانات واضحة عن المادة والصف وهدف الدرس.</p>\n<ul><li>–-</li><li>رابعًا: أبرز النتائج</li></ul>\n<p class='label'>من خلال التجربة الأولية لاحظ الفريق ما يلي:</p>\n<ul><li>- انخفاض الوقت اللازم لإعداد الحصة مقارنة بالطريقة التقليدية.</li><li>- سهولة إنتاج أكثر من فكرة للنشاط الواحد، مما وفر للمعلمة بدائل متنوعة.</li><li>- تنوع واضح في أدوات التقويم والوسائل التعليمية.</li><li>- سهولة إنتاج أنشطة علاجية وإثرائية دون الحاجة إلى إعدادها من البداية.</li><li>- إمكانية إعادة استخدام البرومبتات مع جميع المواد الدراسية بمجرد تغيير بيانات الدرس.</li></ul>\n<p>وفي المقابل، لاحظ الفريق أن جودة المخرجات تعتمد بدرجة كبيرة على دقة البرومبت، لذلك تمت مراجعة البرومبتات وتحسينها عدة مرات حتى أصبحت أكثر وضوحًا وتنظيمًا.</p>\n<ul><li>خامسًا: التحديات التي واجهت الفريق</li><li>واجه الفريق عددًا من التحديات أثناء تنفيذ المشروع، من أهمها:</li><li>- تحويل الفكرة من مجرد برومبتات إلى منتج عملي متكامل.</li><li>- تنظيم المحتوى داخل بنوك يسهل الرجوع إليها.</li><li>- تصميم برومبتات عامة تناسب مختلف المواد الدراسية.</li><li>- ضمان توافق المخرجات مع فلسفة المدرسة وعدم إنتاج أنشطة عشوائية.</li></ul>\n<p>- المحافظة على بساطة الاستخدام حتى تتمكن أي معلمة من الاستفادة من المنصة دون الحاجة إلى تدريب طويل.</p>\n<p>وقد تمت معالجة هذه التحديات من خلال إعادة تنظيم الوحدات، وتصنيف المحتوى، وإعداد دليل استخدام يوضح خطوات الاستفادة من المنصة.</p>\n<ul><li>سادسًا: الدروس المستفادة</li></ul>\n<p>أبرز ما تعلمه الفريق من تنفيذ المشروع هو أن نجاح استخدام الذكاء الاصطناعي في التعليم لا يعتمد على الأداة نفسها، وإنما يعتمد على حسن تصميم البرومبت، وتنظيم المحتوى، وربط المخرجات بالأهداف التعليمية.</p>\n<p>كما أدرك الفريق أن الذكاء الاصطناعي لا يغني عن دور المعلمة، بل يختصر الوقت والجهد ويمنحها فرصة أكبر للتركيز على إدارة التعلم، ومتابعة الطلاب، وتنفيذ الأنشطة داخل الصف.</p>\n<ul><li>سابعًا: الأثر المتوقع لتطبيق المشروع داخل مدارس من أحياها</li></ul>\n<p>من المتوقع أن يسهم تطبيق منصة المعلمة الذكية في تحقيق أثر إيجابي على مستوى المعلمة، والطالب، والمدرسة، وجودة العملية التعليمية، وذلك على النحو الآتي:</p>\n<ul><li>أولًا: الأثر على المعلمة</li></ul>\n<p>- تقليل الوقت المستغرق في إعداد الحصص والأنشطة والوسائل التعليمية، مما يتيح للمعلمة التركيز على التخطيط والإبداع داخل الصف.</p>\n<p>- توفير مصدر موحد يضم أنشطة ووسائل وتقويمات جاهزة، مما يقلل الحاجة إلى البحث في مصادر متعددة.</p>\n<ul><li>- رفع كفاءة توظيف الذكاء الاصطناعي في الممارسات اليومية بصورة منظمة وآمنة.</li><li>- زيادة ثقة المعلمة في تصميم أنشطة متنوعة تناسب مختلف مستويات الطلاب.</li><li>- تشجيع تبادل الخبرات بين المعلمات من خلال مشاركة الأنشطة والبرومبتات وتطويرها باستمرار.</li><li>ثانيًا: الأثر على الطالب</li><li>- زيادة مشاركة الطلاب داخل الحصة من خلال تنوع الأنشطة التعليمية.</li></ul>\n<p>- رفع مستوى الدافعية للتعلم نتيجة استخدام استراتيجيات تعلم نشط وألعاب تعليمية ووسائل جذابة.</p>\n<ul><li>- مراعاة الفروق الفردية بصورة أفضل من خلال توفير أنشطة علاجية وإثرائية جاهزة.</li><li>- تنمية مهارات التفكير، والتعاون، وحل المشكلات، والتواصل، بدلاً من الاعتماد على التلقين.</li><li>- توفير فرص تعلم أكثر تفاعلية تسهم في تحسين تجربة الطالب داخل الصف.</li><li>ثالثًا: الأثر على المدرسة</li></ul>\n<p>- توحيد جودة الأنشطة التعليمية بين المعلمات من خلال الاعتماد على بنك أنشطة موحد يتوافق مع فلسفة المدرسة.</p>\n<ul><li>- بناء مكتبة رقمية قابلة للنمو والتحديث المستمر، تصبح مرجعًا لجميع المعلمات.</li><li>- دعم توجه المدرسة نحو التحول الرقمي والاستخدام الفعال للذكاء الاصطناعي في التعليم.</li></ul>\n<p>- تقليل الوقت والجهد المبذول في إعداد الموارد التعليمية، مما يرفع كفاءة العمل داخل المدرسة.</p>\n<ul><li>- تعزيز ثقافة الابتكار والتطوير المهني بين أعضاء الهيئة التعليمية.-</li><li>رابعًا: الأثر على جودة العملية التعليمية</li><li>- زيادة تنوع استراتيجيات التدريس داخل الحصص.</li><li>- تحسين جودة التخطيط للحصة من خلال ربط الأنشطة والوسائل والتقويم بنواتج التعلم.</li><li>- تعزيز تطبيق التعلم النشط والتعلم التعاوني بما يتوافق مع فلسفة مدارس من أحياها.</li><li>- تحسين جودة أدوات التقويم بحيث تقيس الفهم والتطبيق والتفكير، وليس الحفظ فقط.</li></ul>\n<p>- دعم اتخاذ القرارات التعليمية بناءً على نتائج التقويم من خلال توفير أنشطة علاجية وإثرائية مناسبة.</p>\n<ul><li>خامسًا: الأثر المستقبلي للمشروع</li><li>- إمكانية تطوير المنصة لتصبح نظامًا رقميًا داخليًا يخدم جميع معلمات المدرسة.</li><li>- إضافة بنوك جديدة للأنشطة والوسائل بشكل مستمر، لتكوين قاعدة معرفية تعليمية متجددة.</li><li>- تعميم التجربة على جميع المراحل الدراسية داخل المدرسة بعد تقييم نتائج التطبيق.</li><li>- الاستفادة من المشروع في تدريب المعلمات الجدد على التخطيط للحصص وتوظيف الذكاء الاصطناعي.</li></ul>\n<p>- تحويل المنصة إلى نموذج يمكن الاستفادة منه في مبادرات تطوير التعليم داخل مؤسسات تعليمية أخرى.</p>\n<ul><li>الخلاصة</li></ul>\n<p>لا يقتصر أثر منصة المعلمة الذكية على توفير الوقت فحسب، بل يمتد ليشمل تحسين جودة التخطيط للحصة، وتعزيز التعلم النشط، ودعم المعلمة في تصميم خبرات تعليمية أكثر تنوعًا وفاعلية، وبناء ثقافة مدرسية قائمة على الابتكار والتطوير المستمر، بما ينسجم مع رؤية مدارس من أحياها في تقديم تعليم نوعي يركز على المتعلم ويستثمر التقنيات الحديثة بصورة مسؤولة. \":</p>\n<ul><li>![](media/image1.jpg){width=\"6.304488188976378in\" height=\"8.92187554680665in\"}</li></ul>\n<p class='label'>:</p>\n<ul><li>يوصي الفريق بما يلي</li><li>- تجربة المنصة على عدد أكبر من المعلمات والحصول على تغذية راجعة لتطويرها.</li><li>- إضافة أنشطة جديدة بصورة دورية داخل بنوك المنصة.</li><li>- إنشاء نسخة إلكترونية تفاعلية يمكن البحث داخلها بسهولة.</li><li>- ربط المنصة بمكتبة رقمية مشتركة للأنشطة والوسائل التعليمية.</li><li>- إعداد ورش تدريبية قصيرة لتعريف المعلمات بطريقة استخدام المنصة والاستفادة منها.</li><li>خاتمة</li></ul>\n<p>يمثل مشروع منصة المعلمة الذكية خطوة عملية نحو توظيف الذكاء الاصطناعي في خدمة العملية التعليمية، من خلال تقديم منتج يسهم في تخفيف العبء عن المعلمة، ويدعم جودة التخطيط للحصص، ويعزز التعلم النشط داخل الصف.</p>\n<p>ويؤمن الفريق بأن نجاح هذا المشروع لا يقاس فقط بما تم إنجازه في الورشة، بل بقدرته على التطور والاستمرار ليصبح موردًا تعليميًا تستخدمه المعلمات بصورة يومية داخل مدارس من أحياها..</p>"

     "intro": "<p><strong>الهدف العام للمشروع:</strong> قياس أثر المشروع على المعلمة، والطالب، وجودة العملية التعليمية بعد تطبيقه داخل المدرسة لضمان التطوير المستمر.</p><h4>جدول مؤشرات الأداء الرئيسية (KPIs)</h4><div class='guide-table kpi-table'><div class='gt-row'><div class='gt-cell gt-goal'>تقليل زمن تحضير الحصة</div><div class='gt-cell gt-desc'>الوقت الذي تستغرقه المعلمة في إعداد الحصة<br><span class='gt-sub'>طريقة القياس: مقارنة الزمن قبل وبعد استخدام المنصة — أسبوعين بعد التطبيق</span></div></div><div class='gt-row'><div class='gt-cell gt-goal'>تنوع الأنشطة</div><div class='gt-cell gt-desc'>عدد وأنواع الأنشطة المستخدمة داخل الحصة<br><span class='gt-sub'>طريقة القياس: مراجعة خطط الدروس — أسبوعيًا</span></div></div><div class='gt-row'><div class='gt-cell gt-goal'>رضا المعلمات</div><div class='gt-cell gt-desc'>مدى سهولة استخدام المنصة والاستفادة منها<br><span class='gt-sub'>طريقة القياس: استبانة قصيرة — نهاية فترة التجربة</span></div></div><div class='gt-row'><div class='gt-cell gt-goal'>زيادة مشاركة الطلاب</div><div class='gt-cell gt-desc'>تفاعل الطلاب أثناء الأنشطة<br><span class='gt-sub'>طريقة القياس: بطاقة ملاحظة صفية — أثناء الحصة</span></div></div><div class='gt-row'><div class='gt-cell gt-goal'>جودة الوسائل التعليمية</div><div class='gt-cell gt-desc'>مدى ارتباط الوسيلة بهدف الدرس<br><span class='gt-sub'>طريقة القياس: تقييم المشرف أو قائد المرحلة — شهريًا</span></div></div><div class='gt-row'><div class='gt-cell gt-goal'>جودة التقويم</div><div class='gt-cell gt-desc'>تنوع أدوات التقويم وارتباطها بنواتج التعلم<br><span class='gt-sub'>طريقة القياس: تحليل نماذج التقويم — بعد كل وحدة دراسية</span></div></div><div class='gt-row'><div class='gt-cell gt-goal'>مراعاة الفروق الفردية</div><div class='gt-cell gt-desc'>وجود أنشطة علاجية وإثرائية داخل الحصة<br><span class='gt-sub'>طريقة القياس: مراجعة خطة الدرس — أسبوعيًا</span></div></div><div class='gt-row'><div class='gt-cell gt-goal'>توظيف الذكاء الاصطناعي</div><div class='gt-cell gt-desc'>عدد مرات استخدام المنصة ف  "guide_text": "<h4>مرحبًا بكِ في منصة المعلمة الذكية</h4><p>منصة المعلمة الذكية هي رفيقتكِ المثالية في رحلة التحضير للحصص الدراسية. صُممت لتكون دليلكِ خطوة بخطوة نحو إعداد حصص متكاملة ومبتكرة باستخدام قوة الذكاء الاصطناعي. وفّري وقتكِ وجهدكِ وركزي على ما يهم حقًا: إلهام طلابكِ وتمكينهم.</p><ul><li>تمهيد احترافي: اجذبي انتباه طلابكِ من اللحظة الأولى.</li><li>أنشطة تعليمية: صممي فعاليات تفاعلية تعزز الفهم.</li><li>وسائل تعليمية: ابتكروا أدوات جذابة تدعم التعلم.</li><li>أدوات تقويم: قيسي استيعاب الطلاب بفعالية.</li><li>دعم وإثراء: قدمي الدعم للمتعثرين وحفزي المتميزين.</li><li>حصة كاملة: احصلي على خطة درس متكاملة جاهزة للتنفيذ.</li></ul><h4>قبل أن تبدئي: بيانات أساسية لنتائج دقيقة</h4><p>تأكدي من توفير البيانات التالية لضمان الحصول على أفضل مخرجات من المنصة. كلما كانت بياناتكِ أكثر دقة، كانت المخرجات التعليمية أكثر جودة وتخصيصًا.</p><ul><li>المادة الدراسية: (مثال: علوم، رياضيات، لغة عربية)</li><li>الصف الدراسي: (مثال: الرابع الابتدائي، الثاني المتوسط)</li><li>عنوان الدرس: (مثال: دورة الماء في الطبيعة)</li><li>نواتج التعلم: (ماذا يجب أن يتعلم الطالب بنهاية الحصة؟)</li><li>زمن الحصة: (مثال: 45 دقيقة)</li><li>عدد الطلاب: (لتقدير حجم الأنشطة والمجموعات)</li></ul><p class='label' style='margin-top:10px'>⚡ ملاحظة هامة: المخرجات عالية الجودة تبدأ بمدخلات دقيقة!</p><h4>رحلة المعلمة داخل المنصة</h4><ol><li>إدخال بيانات الدرس</li><li>اختيار التمهيد</li><li>اختيار النشاط</li><li>إنشاء الوسيلة</li><li>إعداد التقويم</li><li>إعداد الدعم أو الإثراء</li><li>تنفيذ الحصة</li></ol><h4>متى أستخدم كل وحدة؟ دليلكِ الشامل</h4><div class='guide-table'><div class='gt-row'><div class='gt-cell gt-goal'>جذب انتباه الطلاب</div><div class='gt-cell gt-unit'>بنك التمهيد</div><div class='gt-cell gt-desc'>اقتراحات لبدايات شيقة للحصة</div></div><div class='gt-row'><div class='gt-cell gt-goal'>تنفيذ نشاط تعليمي</div><div class='gt-cell gt-unit'>بنك الأنشطة</div><div class='gt-cell gt-desc'>أفكار لأنشطة تفاعلية ومتنوعة</div></div><div class='gt-row'><div class='gt-cell gt-goal'>تصميم وسيلة تعليمية</div><div class='gt-cell gt-unit'>بنك الوسائل</div><div class='gt-cell gt-desc'>أدوات بصرية وسمعية لدعم الشرح</div></div><div class='gt-row'><div class='gt-cell gt-goal'>إعداد تقويم للحصة</div><div class='gt-cell gt-unit'>بنك التقويم</div><div class='gt-cell gt-desc'>أسئلة واختبارات لتقييم الاستيعاب</div></div><div class='gt-row'><div class='gt-cell gt-goal'>علاج الطلاب المتعثرين</div><div class='gt-cell gt-unit'>بنك الدعم</div><div class='gt-cell gt-desc'>أنشطة مساندة للطلاب الذين يحتاجون للمساعدة</div></div><div class='gt-row'><div class='gt-cell gt-goal'>إثراء الطلاب المتميزين</div><div class='gt-cell gt-unit'>بنك الإثراء</div><div class='gt-cell gt-desc'>تحديات وأنشطة إضافية للطلاب المتقدمين</div></div><div class='gt-row'><div class='gt-cell gt-goal'>إعداد الحصة كاملة</div><div class='gt-cell gt-unit'>البرومبت الرئيسي</div><div class='gt-cell gt-desc'>ينشئ لكِ خطة درس متكاملة تغطي جميع الجوانب</div></div></div><h4>مثال عملي: تجربة استخدام حقيقية</h4><p>لتوضيح كيفية عمل المنصة، لنأخذ مثالاً عملياً:</p><p class='label'>المادة: العلوم الصف: الرابع الابتدائي عنوان الدرس: دورة الماء في الطبيعة</p><p class='label' style='margin-top:10px'>1. تمهيد</p><ul><li>الناتج: صورة جذابة توضح مراحل دورة الماء مع سؤال تحفيزي.</li></ul><p class='label' style='margin-top:10px'>2. نشاط</p><ul><li>الناتج: فكرة \"محطات تعلم\" حيث يمر الطلاب بمراحل مختلفة (مثل: محطة التجربة، محطة الرسم، محطة البحث).</li></ul><p class='label' style='margin-top:10px'>3. وسيلة تعليمية</p><ul><li>الناتج: بطاقات تعليمية مصورة تشرح كل مرحلة من مراحل دورة الماء.</li></ul><p class='label' style='margin-top:10px'>4. تقويم</p><ul><li>الناتج: \"Exit Ticket\" (تذكرة خروج) عبارة عن سؤال سريع يلخص أهم نقاط الدرس.</li></ul><p class='label' style='margin-top:10px'>5. دعم وإثراء</p><ul><li>الناتج: نشاط علاجي بسيط للطلاب الذين لم يستوعبوا المفهوم بشكل كامل، ونشاط إثرائي للطلاب المتقدمين (مثل: بحث عن تأثير التلوث على دورة الماء).</li></ul><p class='label' style='margin-top:10px'>6. حصة كاملة</p><ul><li>الناتج: خطة درس متكاملة تجمع كل هذه العناصر في هيكل واحد جاهز للتنفيذ.</li></ul><h4>شجرة اتخاذ القرار: اختياراتكِ التعليمية</h4><ul><li>هل تريدين تمهيدًا لجذب الانتباه؟ → استخدمي بنك التمهيد</li><li>هل تحتاجين لنشاط تعليمي تفاعلي؟ → استكشفي بنك الأنشطة</li><li>هل ترغبين في إنشاء وسيلة تعليمية؟ → توجهي إلى بنك الوسائل</li><li>هل تحتاجين لأداة لتقييم فهم الطلاب؟ → اعتمدي على بنك التقويم</li><li>هل ترغبين في دعم الطلاب المتعثرين؟ → استفيدي من بنك الدعم</li><li>هل تسعين لإثراء الطلاب المتميزين؟ → زوري بنك الإثراء</li></ul><h4>أفضل الممارسات: لتحقيق أقصى استفادة</h4><ul><li>ابدئي دائمًا بنواتج التعلم: هي البوصلة التي توجه كل قراراتكِ.</li><li>اختاري نشاطًا واحدًا يناسب الهدف: التركيز أفضل من التشتت.</li><li>استخدمي وسيلة تعليمية تخدم النشاط: اجعلي الأدوات داعمة للعملية التعليمية.</li><li>راجعي جميع مخرجات الذكاء الاصطناعي: تأكدي من دقتها وملاءمتها.</li><li>عدّلي الأنشطة بما يناسب طلابكِ: خصصي المحتوى ليناسب احتياجات صفكِ.</li><li>اجعلي الطالب محور التعلم: الأنشطة يجب أن تشجع على المشاركة الفعالة.</li><li>لا تكثري الأنشطة داخل الحصة الواحدة: حافظي على توازن بين التعلم والتطبيق.</li></ul><h4>الاستخدام المسؤول للذكاء الاصطناعي</h4><p>الذكاء الاصطناعي أداة قوية، واستخدامه بمسؤولية يضمن بيئة تعليمية آمنة وموثوقة.</p><ul><li>راجعي جميع المخرجات: لا تعتمدي بشكل أعمى على ما يولده الذكاء الاصطناعي.</li><li>تحققي من صحة المعلومات: خاصة في المواد العلمية والتاريخية.</li><li>احمي بيانات الطلاب: لا تدخلي أي معلومات شخصية أو حساسة للطلاب أو لأي شخص.</li><li>استخدمي الذكاء الاصطناعي كمساعد: هو أداة لدعمكِ، وليس بديلاً عن دوركِ كمعلمة.</li><li>عدّلي المحتوى بما يناسب بيئة المدرسة: تأكدي من أن المخرجات تتوافق مع سياسات وقيم مدرستكِ.</li></ul><h4>الأسئلة الأكثر شيوعًا</h4><p class='label'>هل يجب استخدام جميع الوحدات في كل حصة؟</p><p>لا، اختاري الوحدة أو الوحدات التي تخدم هدف الحصة التعليمي بشكل مباشر.</p><p class='label'>هل يمكن تعديل المخرجات التي يولدها الذكاء الاصطناعي؟</p><p>نعم بالتأكيد. المخرجات هي مجرد اقتراحات، ويمكنكِ تعديلها وتخصيصها لتناسب احتياجاتكِ.</p><p class='label'>هل تصلح المنصة لجميع المواد الدراسية؟</p><p>نعم، تم تصميم المنصة لتكون مرنة وقابلة للتكيف مع مختلف المواد الدراسية.</p><p class='label'>هل يمكن استخدامها في جميع الصفوف الدراسية؟</p><p>نعم، مع ضرورة تعديل بيانات الدرس (مثل مستوى اللغة، عمق المفاهيم) لتناسب المرحلة العمرية والصف الدراسي.</p><h4>الاستخدام السريع: ابدئي في أقل من دقيقة!</h4><ol><li>اكتبي بيانات الدرس: أدخلي المعلومات الأساسية (المادة، الصف، عنوان الدرس، نواتج التعلم).</li><li>اختاري الوحدة المناسبة: حددي ما تحتاجينه (تمهيد، نشاط، تقويم، إلخ).</li><li>انسخي البرومبت: ستقوم المنصة بتوليده لكِ.</li><li>الصقيه في أداة الذكاء الاصطناعي: استخدمي مولد النص.</li><li>راجعي الناتج: تأكدي من ملاءمته وجودته.</li><li>نفذي الحصة: استخدمي المحتوى المعدّ مباشرة!</li></ol><p style='text-align:center;font-weight:800;color:var(--ink-2);margin-top:14px'>منصة المعلمة الذكية: لأن وقت المعلمة يستحق أن يُستثمر في الإبداع لا في تكرار التحضير.</p>"
}</script>

<script>
/* ============ Data ============ */
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var GUIDE = JSON.parse(document.getElementById('guide-images').textContent);

var ICONS = {
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',

  gear: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18 6l-1.5 1.5M7.5 16.5L6 18M18 18l-1.5-1.5M7.5 7.5L6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  clipboard: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 11h7M8.5 15h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  heart: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7.5-4.6-9.6-9.4C1 7 2.7 3.8 6 3.2c2-.4 3.9.5 5 2 .1.1.9.1 1 0 1.1-1.5 3-2.4 5-2 3.3.6 5 3.8 3.6 7.4C19.5 15.4 12 20 12 20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  chat: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M21 12a8 8 0 01-11.4 7.2L4 20l1.1-4.3A8 8 0 1121 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 11h8M8 14h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  image: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2.4" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M21 16l-5.5-5-8.5 7" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  star: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2.8l2.7 5.9 6.3.7-4.7 4.4 1.3 6.4L12 17l-5.6 3.2 1.3-6.4-4.7-4.4 6.3-.7L12 2.8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" stroke="currentColor" stroke-width="2"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

var CAT_META = {
  tamheed:   { icon:'eye',       bg:'#EAF0EE' },
  activities:{ icon:'puzzle',    bg:'#F2ECDD' },
  wasael:    { icon:'gear',      bg:'#E9EEF2' },
  taqweem:   { icon:'clipboard', bg:'#EFEAE0' },
  daam:      { icon:'heart',     bg:'#F3E7E4' },
  prompts:   { icon:'chat',      bg:'#E7EEEA' }
};

/* ============ Build flat index for search + siblings ============ */
var FLAT = []; // {catId, catName, groupName, item, siblings, idx}
DATA.categories.forEach(function(cat){
  if (cat.id === 'about') return;
  if (cat.groups) {
    cat.groups.forEach(function(g){
      g.items.forEach(function(it, i){
        FLAT.push({ catId: cat.id, catName: cat.name, groupName: g.group_name, groupId: g.id, item: it, siblings: g.items, idx: i });
      });
    });
  } else if (cat.items) {
    cat.items.forEach(function(it, i){
      FLAT.push({ catId: cat.id, catName: cat.name, groupName: null, groupId: null, item: it, siblings: cat.items, idx: i });
    });
  }
});

function findEntry(catId, groupId, code){
  for (var i=0;i<FLAT.length;i++){
    var e = FLAT[i];
    if (e.catId===catId && (groupId ? e.groupId===groupId : true) && e.item.code===code) return e;
  }
  return null;
}

/* ============ Navigation stack ============ */
var stack = [{ type:'home' }];

function push(view){ stack.push(view); render(); window.scrollTo(0,0); }
function replaceTop(view){ stack[stack.length-1] = view; render(); }
function goBack(){ if (stack.length>1){ stack.pop(); render(); window.scrollTo(0,0);} }
function goHome(){ stack = [{type:'home'}]; render(); window.scrollTo(0,0); }

/* ============ Helpers ============ */
function stripTags(html){
  var d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
function excerpt(html, n){
  var d = document.createElement('div');
  d.innerHTML = html || '';
  d.querySelectorAll('h4').forEach(function(h){ h.remove(); });
  var t = (d.textContent || '').replace(/\s+/g,' ').trim();
  if (!t) return '';
  return t.length > n ? t.slice(0,n) + '…' : t;
}
function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtTitle(s){
  var e = esc(s);
  // isolate parenthetical Latin fragments so bidi doesn't mangle wrapping
  return e.replace(/\(([^()]*[A-Za-z][^()]*)\)/g, '<span dir="ltr" style="unicode-bidi:isolate">($1)</span>');
}
function icon(name){ return ICONS[name] || ''; }

var toastTimer = null;
function showToast(msg){
  var t = document.getElementById('toast');
  t.innerHTML = icon('check') + '<span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1700);
}

function copyPrompt(text, btn){
  var done = function(){
    btn.classList.add('copied');
    btn.innerHTML = icon('check') + '<span>تم النسخ</span>';
    showToast('تم نسخ البرومبت، جاهز للصق في أداة الذكاء الاصطناعي');
    setTimeout(function(){
      btn.classList.remove('copied');
      btn.innerHTML = icon('copy') + '<span>نسخ البرومبت</span>';
    }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  cb();
}

/* ============ Renderers ============ */
var app = document.getElementById('app');

function render(){
  var view = stack[stack.length-1];
  var html = '';
  if (view.type === 'home') html = renderHome();
  else if (view.type === 'category') html = renderCategory(view);
  else if (view.type === 'item') html = renderItem(view);
  else if (view.type === 'search') html = renderSearch(view);
  else if (view.type === 'guide') html = renderGuide();
  else if (view.type === 'about') html = renderAbout();
  app.innerHTML = html;
  wireEvents(view);
}

function renderHome(){
  var cats = DATA.categories.filter(function(c){ return c.id !== 'about'; });
  var rows = cats.map(function(c){
    var meta = CAT_META[c.id] || {icon:'star', bg:'#EEE'};
    var count = c.groups ? c.groups.reduce(function(s,g){return s+g.items.length;},0) : (c.items? c.items.length:0);
    return '<div class="cat-row" data-nav="category" data-cat="'+c.id+'">' +
      '<div class="cat-icon" style="background:'+meta.bg+'">'+icon(meta.icon)+'</div>' +
      '<div class="cat-main"><h3>'+fmtTitle(c.name)+'</h3><p>'+esc(c.subtitle)+'</p></div>' +
      '<div class="cat-count">'+count+'</div>' +
      '<svg class="row-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" style="color:var(--muted);transform:scaleX(-1)"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '</div>';
  }).join('');

  return '' +
  '<div class="hero">' +
    '<div class="hero-top">' +
      '<div class="brand">' +
        '<div class="brand-mark">م</div>' +
        '<div class="brand-text"><h1>منصة المعلمة الذكية</h1><p>جمعية من أحياها</p></div>' +
      '</div>' +
    '</div>' +
    '<div class="hero-title">كل ما تحتاجينه لتحضير حصة متكاملة<br>في أقل من ٥ دقائق</div>' +
    '<div class="hero-sub">تمهيد، نشاط، وسيلة، تقويم، دعم وإثراء — منظمة وجاهزة للاستخدام</div>' +
    '<div class="search-box" data-nav="search">' + icon('search') +
      '<input type="text" placeholder="ابحث في كل البنوك... مثال: بطاقة خروج" readonly>' +
    '</div>' +
  '</div>' +
  '<div id="content">' +
    '<div class="section-label">بنوك المنصة</div>' +
    '<div class="row-list" style="margin-bottom:18px">' + rows + '</div>' +
    '<div class="link-row" data-nav="guide">' +
      '<div class="link-row-left">'+icon('image')+'<span>دليل الاستخدام الشامل</span></div>' +
      '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '</div>' +
    '<div class="link-row" data-nav="about">' +
      '<div class="link-row-left">'+icon('star')+'<span>عن المشروع والجمعية</span></div>' +
      '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '</div>' +
  '</div>';
}

function pageHead(eyebrow, title){
  return '<div class="page-head">' +
    '<div class="back" data-back="1">'+icon('back')+'</div>' +
    '<div class="page-head-text">' + (eyebrow?'<p class="eyebrow">'+esc(eyebrow)+'</p>':'') + '<h2>'+fmtTitle(title)+'</h2></div>' +
  '</div>';
}

function renderCategory(view){
  var cat = DATA.categories.filter(function(c){return c.id===view.cat;})[0];
  if (!cat) return pageHead('', 'غير موجود') + '<div id="content"></div>';
  var body = '';
  if (cat.groups){
    cat.groups.forEach(function(g){
      var rows = g.items.map(function(it){ return itemRow(cat.id, g.id, it); }).join('');
      body += '<div class="group-title"><span class="dot"></span>'+esc(g.group_name)+'</div>' +
              '<div class="row-list">'+rows+'</div>';
    });
  } else if (cat.items){
    var rows = cat.items.map(function(it){ return itemRow(cat.id, null, it); }).join('');
    body += '<div class="row-list" style="margin-top:6px">'+rows+'</div>';
  }
  return pageHead('بنوك المنصة', cat.name) + '<div id="content">'+body+'</div>';
}

function itemRow(catId, groupId, it){
  var sub = excerpt(it.intro || it.prompt_html || '', 42);
  return '<div class="row" data-nav="item" data-cat="'+catId+'" data-group="'+(groupId||'')+'" data-code="'+it.code+'">' +
    '<div class="row-badge code">'+esc(it.code||'•')+'</div>' +
    '<div class="row-main"><h3>'+fmtTitle(it.title)+'</h3>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>' +
    '<svg class="row-chev" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
  '</div>';
}

function renderItem(view){
  var entry = findEntry(view.cat, view.group, view.code);
  if (!entry) return pageHead('', 'غير موجود') + '<div id="content"></div>';
  var it = entry.item;
  var eyebrow = entry.groupName ? entry.catName+' › '+entry.groupName : entry.catName;

  var promptBlock = '';
  if (it.prompt_html){
    promptBlock = '<div class="prompt-card">' +
      '<div class="prompt-card-head">' +
        '<div class="ph-title">🤖 <span>البرومبت الجاهز</span></div>' +
        '<button class="copy-btn" data-copy="1">'+icon('copy')+'<span>نسخ البرومبت</span></button>' +
      '</div>' + it.prompt_html + '</div>';
  }

  var hasPrev = entry.idx > 0;
  var hasNext = entry.idx < entry.siblings.length - 1;

  var reader = '<div class="reader">' +
      '<div class="reader-eyebrow">'+(it.code?'<span class="badge">'+esc(it.code)+'</span>':'')+'</div>' +
      '<h2 class="title">'+fmtTitle(it.title)+'</h2>' +
      (it.intro || '') +
      promptBlock +
    '</div>';

  var pager = '<div class="pager">' +
      '<button data-page="next" '+(hasNext?'':'disabled')+'>التالي <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<button data-page="prev" '+(hasPrev?'':'disabled')+'><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> السابق</button>' +
    '</div>';

  return pageHead(eyebrow, it.title) + '<div id="content" data-cat="'+entry.catId+'" data-group="'+(entry.groupId||'')+'">'+reader+pager+'</div>';
}

function renderSearch(view){
  var q = (view.q || '').trim();
  var head = '<div class="page-head">' +
      '<div class="back" data-back="1">'+icon('back')+'</div>' +
      '<div class="search-box" style="flex:1;box-shadow:none;background:rgba(244,239,223,.14)">' +
        '<span style="color:#F4EFDF">'+icon('search')+'</span>' +
        '<input id="search-input" type="text" placeholder="ابحث عن نشاط، وسيلة، أو برومبت..." value="'+esc(q)+'" style="color:#F4EFDF">' +
      '</div>' +
    '</div>';

  var resultsHtml = '';
  if (q.length < 2){
    resultsHtml = '<div class="search-empty">اكتبي كلمتين على الأقل للبحث<br>مثل: «بطاقة خروج» أو «لعبة»</div>';
  } else {
    var qn = q.toLowerCase();
    var hits = FLAT.filter(function(e){
      var hay = (e.item.title + ' ' + stripTags(e.item.intro||'') + ' ' + stripTags(e.item.prompt_html||'')).toLowerCase();
      return hay.indexOf(qn) !== -1;
    }).slice(0, 40);
    if (!hits.length){
      resultsHtml = '<div class="search-empty">لا توجد نتائج لـ «'+esc(q)+'»</div>';
    } else {
      resultsHtml = '<div class="search-results">' + hits.map(function(e){
        var path = e.groupName ? e.catName+' › '+e.groupName : e.catName;
        var sub = excerpt(e.item.intro || e.item.prompt_html || '', 60);
        return '<div class="search-hit" data-nav="item" data-cat="'+e.catId+'" data-group="'+(e.groupId||'')+'" data-code="'+e.item.code+'">' +
          '<div class="path">'+esc(path)+'</div>' +
          '<h4>'+fmtTitle(e.item.title)+'</h4>' +
          '<p>'+esc(sub)+'</p>' +
        '</div>';
      }).join('') + '</div>';
    }
  }
  return head + '<div id="content" style="padding-top:16px">'+resultsHtml+'</div>';
}

function renderGuide(){
  var imgs = GUIDE.map(function(src, i){
    return '<div class="guide-shot"><img src="'+src+'" loading="lazy" alt="خطوة '+(i+1)+'"></div>';
  }).join('');
  var textGuide = DATA.guide_text ? '<div class="reader">'+DATA.guide_text+'</div>' : '';
  return pageHead('', 'دليل الاستخدام') +
    '<div id="content">' + textGuide +
      '<div class="section-label" style="margin-top:22px">شاشات المنصة خطوة بخطوة</div>' + imgs +
    '</div>';
}

function renderAbout(){
  var cat = DATA.categories.filter(function(c){return c.id==='about';})[0];
  var blocks = (cat? cat.items : []).map(function(it){
    return '<div class="reader"><h2 class="title" style="font-size:19px">'+esc(it.title)+'</h2>' + (it.intro||'') + '</div>';
  }).join('');
  return pageHead('', 'عن المشروع') +
    '<div id="content">' +
      '<div class="about-hero"><div class="mark">م</div><h2>منصة المعلمة الذكية</h2><p>AI Teacher Toolkit — جمعية من أحياها</p></div>' +
      blocks +
    '</div>';
}

/* ============ Event wiring ============ */
function wireEvents(view){
  app.querySelectorAll('[data-back]').forEach(function(el){
    el.addEventListener('click', goBack);
  });
  app.querySelectorAll('[data-nav="category"]').forEach(function(el){
    el.addEventListener('click', function(){ push({type:'category', cat: el.getAttribute('data-cat')}); });
  });
  app.querySelectorAll('[data-nav="item"]').forEach(function(el){
    el.addEventListener('click', function(){
      push({type:'item', cat: el.getAttribute('data-cat'), group: el.getAttribute('data-group')||null, code: el.getAttribute('data-code')});
    });
  });
  var searchTrigger = app.querySelector('.search-box[data-nav="search"]');
  if (searchTrigger) searchTrigger.addEventListener('click', function(){ push({type:'search', q:''}); });
  var guideTrigger = app.querySelector('[data-nav="guide"]');
  if (guideTrigger) guideTrigger.addEventListener('click', function(){ push({type:'guide'}); });
  var aboutTrigger = app.querySelector('[data-nav="about"]');
  if (aboutTrigger) aboutTrigger.addEventListener('click', function(){ push({type:'about'}); });

  var input = document.getElementById('search-input');
  if (input){
    input.focus();
    input.addEventListener('input', function(){
      stack[stack.length-1] = { type:'search', q: input.value };
      render();
      var i2 = document.getElementById('search-input');
      if (i2){ i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); }
    });
  }

  var copyBtn = app.querySelector('[data-copy]');
  if (copyBtn){
    copyBtn.addEventListener('click', function(){
      var entry = findEntry(view.cat, view.group, view.code);
      if (entry && entry.item.prompt_text) copyPrompt(entry.item.prompt_text, copyBtn);
    });
  }

  app.querySelectorAll('[data-page]').forEach(function(el){
    el.addEventListener('click', function(){
      if (el.disabled) return;
      var dir = el.getAttribute('data-page');
      var entry = findEntry(view.cat, view.group, view.code);
      if (!entry) return;
      var newIdx = dir === 'next' ? entry.idx + 1 : entry.idx - 1;
      var target = entry.siblings[newIdx];
      if (target) replaceTop({ type:'item', cat: view.cat, group: view.group, code: target.code });
    });
  });
}

render();

</script>
</body>
</html>
